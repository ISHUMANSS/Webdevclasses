<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="description" content="COMP721 Assignment 2">
        <meta name="keywords" content="Web Development, Assignment 2">
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
        <title>Web Development Assignment 2</title>

        <script type="text/javascript" src="booking.js"></script>




        <script>
            //script to make the time and date be the current time and date

            //i didn't use dom organaly but found that the page loading time broke it
            document.addEventListener('DOMContentLoaded', function() {
                const today = new Date();
                //automaticly get the current date when the page is loaded and update the value in the date selector
                document.getElementById("date").value = today.toISOString().substr(0, 10);


                //automaticly get the current time when the page is loaded and put that in the time selector
                //had an issue where it would be in the incorrect format so i needed to add padStart
                //so that it wouldn't be in the wrong format
                const hours = today.getHours().toString().padStart(2, '0');
                const minutes = today.getMinutes().toString().padStart(2, '0');

                document.getElementById("time").value = hours + ":" + minutes;
            });
        </script>

    </head>
    <body>
        <div class="container-fluid">
            <div class="nav">
                <a href="index.html" class="btn">Home</a>
                <a href="booking.html" class="btn">Booking</a>
                <a href="admin.html" class="btn">Admin</a>
            </div>
            <h1 class="page_title">Booking Request</h1>

             
            <!--target div for booking confirmation message-->
            <div id="reference"> 
               
            </div> 
            <br>

            <div class="booking">


                <div class="form_container">
                    <form action="" method="post">
                            <div class="form_item">
                                <label for="cname">Customer Name:</label>
                                <input type="text" name="cname" placeholder="John Doe" required>
                            </div>
                            <div class="form_item">
                                <label for="phone">Phone Number:</label>
                                <input type="text" name="phone" placeholder="12345678912" pattern="[0-9]{10,12}" maxlength="12" required>
                            </div>
                            <div class="form_item">
                                <label for="unumber">Unit Number:</label>
                                <input type="text" name="unumber">
                            </div>
                            <div class="form_item">
                                <label for="snumber">Street Number:</label>
                                <input type="text" name="snumber" placeholder="1" required>
                            </div>
                            <div class="form_item">
                                <label for="stname">Street Name:</label>
                                <input type="text" name="stname" placeholder="St Paul Street" required>
                            </div>
                            <div class="form_item">
                                <label for="sbname">Suburb:</label>
                                <input type="text" name="sbname" placeholder="Mangere">
                            </div>
                            <div class="form_item">
                                <label for="dsbname">Destination Suburb:</label>
                                <input type="text" name="dsbname" placeholder="Manukau">
                            </div>
                            <div class="form_item">
                                <!--auto gets the current date-->
                                <label for="date">Pick-Up Date:</label>
                                <input id="date" type="date" name="date"  required>
                            </div>
                            <div class="form_item">
                                <label for="time">Pick-Up Time:</label>
                                <input id="time" type="time" name="time" required>
                            </div>

                        <div class="form_item">
                            <input name="submit" type="button" onclick="" value="Book Taxi">
                        </div>
                    </form>
                </div>

            </div>

           
        </div>
    </body>
</html>
